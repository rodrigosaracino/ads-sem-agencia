        const { useState, useEffect, useRef, memo } = React;

        /* ─── Conversões: Meta Pixel ─────────────────────────────── */
        function fireCheckoutConversion() {
            if (typeof fbq !== 'undefined') {
                fbq('track', 'InitiateCheckout', {
                    currency: 'BRL', value: 397.00,
                    content_name: 'Protocolo Cliente na Porta',
                    content_type: 'product'

            window.dataLayer.push({ event: 'checkout_click', value: 397.00, currency: 'BRL' });
        }

        function fireLeadConversion(nome, telefone) {
            if (typeof fbq !== 'undefined') {
                fbq('track', 'Lead', { content_name: 'Protocolo Cliente na Porta' });
            }
            window.dataLayer = window.dataLayer || [];
            window.dataLayer.push({ event: 'whatsapp_form_submit', user_name: nome });
        }

        /* ─── Hotmart: URL base + UTMs persistentes ──────────────── */
        const BASE_HOTMART = 'https://pay.hotmart.com/Y104360494V?off=av71abb8';

        function buildHotmartUrl() {
            const p = new URLSearchParams(window.location.search);
            const keys = ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term', 'src'];
            const extra = keys
                .filter(k => p.get(k))
                .map(k => `${encodeURIComponent(k)}=${encodeURIComponent(p.get(k))}`)
                .join('&');
            return extra ? `${BASE_HOTMART}&${extra}` : BASE_HOTMART;
        }

        const HOTMART_URL = buildHotmartUrl();

        /* ─── Modal WhatsApp (formulário) ───────────────────────── */
        const WA_ICON = (
            <svg className="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>

        const WhatsAppModal = ({ isOpen, onClose }) => {
            const [nome, setNome] = useState('');
            const [telefone, setTelefone] = useState('');
            const [enviando, setEnviando] = useState(false);

            if (!isOpen) return null;

            const formatPhone = (v) => {
                const d = v.replace(/\D/g, '').slice(0, 11);
                if (d.length <= 2) return d;
                if (d.length <= 6) return `(${d.slice(0,2)}) ${d.slice(2)}`;
                if (d.length <= 10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;
                return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setEnviando(true);

                const params = new URLSearchParams(window.location.search);
                const payload = {
                    nome, whatsapp: telefone,
                    source: 'whatsapp_modal',
                    utm_source:   params.get('utm_source')   || undefined,
                    utm_medium:   params.get('utm_medium')   || undefined,
                    utm_campaign: params.get('utm_campaign') || undefined,
                    data_conversao: new Date().toISOString(),
                    url_origem: window.location.href
                };

                fetch('https://n8n.amzcursos.com/webhook/5a78888a-5999-4e65-8dae-14d8fe25f052', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                }).catch(() => {});

                fetch('https://dash.amzcursos.com/api/public/lead', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: nome, phone: telefone, source: 'landing_page_whatsapp' })
                }).catch(() => {});

                fireLeadConversion(nome, telefone);

                const msg = encodeURIComponent(`Olá Rodrigo! Me chamo ${nome} e tenho interesse no Protocolo Cliente na Porta. Pode me dar mais informações?`);
                window.open(`https://wa.me/5511962650342?text=${msg}`, '_blank');
                onClose();
            };

            return (
                <div
                    className="fixed inset-0 z-[9999] flex items-end sm:items-center justify-center p-0 sm:p-4"
                    style={{ backgroundColor: 'rgba(15,23,42,0.85)', backdropFilter: 'blur(6px)' }}
                    onClick={e => { if (e.target === e.currentTarget) onClose(); }}
                >
                    <div className="bg-white w-full sm:max-w-sm sm:rounded-3xl rounded-t-3xl overflow-hidden shadow-2xl">

                        {/* Header */}
                        <div className="px-5 py-4 flex items-center gap-3" style={{ backgroundColor: '#075E54' }}>

                                {WA_ICON}
                            </div>
                            <div className="flex-1 min-w-0">
                                <p className="text-white font-bold text-sm leading-none">Rodrigo Saracino</p>
                                <p className="text-xs mt-0.5" style={{ color: '#ACE1BF' }}>Protocolo Cliente na Porta</p>
                            </div>
                            <button onClick={onClose} className="p-1 rounded-full hover:bg-white/10 transition-colors" aria-label="Fechar">
                                <svg className="w-5 h-5 text-white/70" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"/>
                                </svg>
                            </button>
                        </div>

                        {/* Corpo */}
                        <div className="p-6">
                            <p className="text-slate-600 text-sm text-center mb-6 leading-relaxed">
                                Antes de abrir o WhatsApp, me conta rapidinho para eu te atender melhor:
                            </p>

                            <form onSubmit={handleSubmit} className="space-y-4">
                                <div>
                                    <label className="block text-xs font-bold text-slate-700 mb-1.5 uppercase tracking-wide">Seu nome</label>
                                    <input
                                        required
                                        type="text"
                                        placeholder="Como posso te chamar?"
                                        value={nome}
                                        onChange={e => setNome(e.target.value)}
                                        className="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm outline-none transition-all focus:ring-2 focus:border-transparent"
                                        style={{ '--tw-ring-color': '#25D366' }}
                                        onFocus={e => e.target.style.boxShadow = '0 0 0 2px #25D366'}
                                        onBlur={e => e.target.style.boxShadow = ''}
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-slate-700 mb-1.5 uppercase tracking-wide">Seu WhatsApp</label>
                                    <input
                                        required
                                        type="tel"
                                        placeholder="(11) 99999-9999"
                                        value={telefone}
                                        onChange={e => setTelefone(formatPhone(e.target.value))}
                                        className="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm outline-none transition-all"
                                        onFocus={e => e.target.style.boxShadow = '0 0 0 2px #25D366'}
                                        onBlur={e => e.target.style.boxShadow = ''}
                                    />
                                </div>

                                <button
                                    type="submit"
                                    disabled={enviando}
                                    className="w-full text-white font-bold py-4 rounded-xl flex items-center justify-center gap-2 transition-all hover:opacity-90 active:scale-[0.98] mt-2"
                                    style={{ backgroundColor: '#25D366' }}
                                >
                                    {enviando
                                        ? <span className="animate-pulse">Abrindo WhatsApp...</span>
                                        : <>{WA_ICON} Falar no WhatsApp agora</>
                                    }
                                </button>
                            </form>

                            <p className="text-[10px] text-center text-slate-400 mt-4 uppercase tracking-widest">
                                Seus dados estão seguros e não serão compartilhados
                            </p>
                        </div>
                    </div>
                </div>
            );
        };

        /* ─── WhatsApp flutuante ─────────────────────────────────── */
        const FloatingWhatsApp = memo(({ onClick }) => (
            <button
                onClick={() => {
                    window.dataLayer = window.dataLayer || [];
                    window.dataLayer.push({'event': 'whatsapp_click'});

                </svg>

        /* ─── SEÇÃO 1 · Hero com VSL ────────────────────────────── */
        const Hero = () => (
            <section className="gradient-hero relative overflow-hidden py-14 px-6">
                <div className="absolute inset-0 opacity-10 pointer-events-none">
                    <svg className="w-full h-full" viewBox="0 0 100 100" preserveAspectRatio="none">

                </div>

                <div className="relative z-10 max-w-5xl mx-auto w-full">

                    {/* Marca + badge */}
                    <div className="text-center mb-5">
                        <span className="text-orange-500 font-black text-2xl sm:text-3xl tracking-tighter uppercase italic">
                            Protocolo Cliente na Porta
                        </span>
                        <div className="flex justify-center mt-3">
                            <div className="inline-flex items-center gap-2 bg-white/10 backdrop-blur-sm rounded-full px-4 py-2">
                                <span className="w-2 h-2 bg-green-400 rounded-full pulse-badge flex-shrink-0"></span>
                                <span className="text-white/90 text-sm font-medium uppercase tracking-wider">Método de 4 Passos · Ativação Hoje</span>
                            </div>
                        </div>
                    </div>

                    {/* Headline */}
                    <h1 className="text-3xl sm:text-5xl lg:text-6xl font-extrabold text-white leading-tight mb-3 text-center">
                        Assuma o Controle das Suas Captações no Google e Atraia Clientes{" "}
                        <span className="text-orange-500">Com o Cartão na Mão</span>

                    <p className="text-lg text-white/75 mb-8 text-center max-w-2xl mx-auto">
                        Sem precisar pagar de{" "}
                        <strong className="text-orange-400">R$&nbsp;1.500 a R$&nbsp;2.500 por mês</strong>{" "}
                        para uma agência — copie e cole o protocolo, ative hoje e receba o primeiro orçamento em menos de 24 horas.
                    </p>

                    {/* ══ VSL ══════════════════════════════════════════════
                        Cole o embed do seu vídeo dentro da div abaixo.

                        <iframe src="https://www.youtube.com/embed/SEU_VIDEO_ID"

                         style={{position:'relative', paddingBottom:'56.25%', height:0}}>
                        {/* Placeholder — substitua pelo seu iframe */}
                        <div style={{position:'absolute',inset:0,display:'flex',flexDirection:'column',
                                     alignItems:'center',justifyContent:'center',gap:'14px',
                                     backgroundColor:'#0f172a'}}>

                                <svg style={{width:36,height:36,color:'#f97316'}} fill="currentColor" viewBox="0 0 24 24">
                                    <path d="M8 5v14l11-7z"/>

                                Substitua este bloco pelo iframe do seu vídeo
                            </p>
                        </div>
                    </div>
                    {/* ═══════════════════════════════════════════════════ */}

                    {/* CTA + micro-copy */}

                        <a
                            href="#oferta"
                            onClick={e => {
                                e.preventDefault();
                                window.dataLayer = window.dataLayer || [];
                                window.dataLayer.push({'event': 'hero_cta_click'});
                                document.getElementById('oferta').scrollIntoView({ behavior: 'smooth' });
                            }}
                            className="gradient-cta text-white font-bold text-lg px-10 py-5 rounded-xl shadow-lg shadow-orange-500/40 hover:scale-105 transition-all uppercase tracking-wide text-center"
                        >
                            Quero Receber Clientes no WhatsApp Hoje →
                        </a>

                            </svg>
                            <span className="text-white/70 text-sm font-medium">7 Dias de Garantia Incondicional — Risco Zero</span>
                        </div>
                    </div>

                </div>
            </section>
        );

        /* ─── SEÇÃO 3 · A Dor ────────────────────────────────────── */
        const Pain = () => (
            <section className="bg-slate-900 py-24 px-6 relative overflow-hidden border-t border-slate-800">
                <div className="absolute top-0 right-0 w-96 h-96 bg-red-500/5 rounded-full blur-[150px] pointer-events-none"></div>
                <div className="absolute bottom-0 left-0 w-72 h-72 bg-orange-500/5 rounded-full blur-[120px] pointer-events-none"></div>

                <div className="max-w-5xl mx-auto relative z-10">
                    <div className="text-center mb-16">
                        <span className="inline-block bg-red-500/10 border border-red-500/20 text-red-400 font-bold text-xs px-4 py-2 rounded-full mb-6 uppercase tracking-wider">
                            A Realidade do Profissional Autônomo
                        </span>
                        <h2 className="text-3xl sm:text-4xl lg:text-5xl font-extrabold text-white leading-tight max-w-4xl mx-auto">
                            Se você é um profissional autônomo, você tem{" "}
                            <span className="text-orange-500">duas opções</span>{" "}
